name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built-in headless analyzer source (era_mcp)
        shell: pwsh
        run: |
          Remove-Item -LiteralPath ".tmp-era-mcp" -Recurse -Force -ErrorAction SilentlyContinue
          git clone --depth 1 --branch v0.1.0 https://github.com/passed1999/era_mcp.git .tmp-era-mcp

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EraTrans.sln

      - name: Build
        run: dotnet build EraTrans.sln --configuration Release --no-restore

      # Test failures are surfaced as annotations so the failing test name and
      # assertion message are readable without signing in to view raw logs.
      - name: Test
        shell: pwsh
        run: |
          dotnet test EraTrans.sln --configuration Release --no-build --verbosity normal 2>&1 |
            Tee-Object -FilePath test-output.log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Select-String -Path test-output.log -Pattern 'Failed |Error Message|Assert\.' |
              Select-Object -First 40 |
              ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
          }
          exit $exitCode

      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean publish output
        shell: pwsh
        run: |
          Remove-Item -LiteralPath "publish/win-x64" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath "artifacts" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Publish single-file Windows x64 application
        run: dotnet publish src/EraTrans.App/EraTrans.App.csproj --configuration Release --runtime win-x64 --self-contained true --output publish/win-x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugSymbols=false -p:DebugType=None

      - name: Publish built-in Emuera.Core analyzer library (shared .NET 10 runtime)
        run: dotnet publish .tmp-era-mcp/Emuera.Core/Emuera.Core.csproj --configuration Release --runtime win-x64 --no-self-contained --output publish/win-x64/tools/analyzer -p:DebugSymbols=false -p:DebugType=None

      - name: Prepare portable folder layout
        shell: pwsh
        run: |
          $publishDirectory = "publish/win-x64"
          $exePath = Join-Path $publishDirectory "EraTrans.App.exe"
          if (-not (Test-Path -LiteralPath $exePath -PathType Leaf)) {
            throw "Single-file publish did not produce EraTrans.App.exe."
          }

          $analyzerDll = Join-Path $publishDirectory "tools/analyzer/Emuera.Core.dll"
          if (-not (Test-Path -LiteralPath $analyzerDll -PathType Leaf)) {
            throw "Built-in analyzer publish did not produce tools/analyzer/Emuera.Core.dll."
          }

          # Strip XML docs and debug symbols from analyzer folder to keep the package lean.
          Get-ChildItem -LiteralPath (Join-Path $publishDirectory "tools/analyzer") -Recurse -Include *.pdb,*.xml -File |
            Remove-Item -Force -ErrorAction SilentlyContinue

          $rootFiles = @(Get-ChildItem -LiteralPath $publishDirectory -File)
          $unexpectedRootFiles = @($rootFiles | Where-Object { $_.Name -ne "EraTrans.App.exe" })
          if ($unexpectedRootFiles.Count -gt 0) {
            $names = ($unexpectedRootFiles | ForEach-Object { $_.Name }) -join ", "
            throw "Unexpected files remain beside the EXE after single-file publish: $names"
          }

          $configDirectory = Join-Path $publishDirectory "Config"
          $docsDirectory = Join-Path $publishDirectory "Docs"
          New-Item -ItemType Directory -Force -Path $configDirectory, $docsDirectory | Out-Null

          @'
          EraTrans configuration files are stored in this folder:
          - settings.json: parser and extraction settings
          - ai-providers.json: AI provider profiles; API keys are encrypted with Windows DPAPI

          Configuration is created automatically when settings are first saved.
          Existing settings from %AppData%\EraTrans are copied here on first launch.
          The original AppData files are kept as backups.
          '@ | Set-Content -LiteralPath (Join-Path $configDirectory "README.txt") -Encoding utf8

          @'
          EraTrans - Windows x64

          1. Extract the downloaded artifact once.
          2. Run EraTrans.App.exe.
          3. Configure parser options in 设置.
          4. Configure an OpenAI-compatible AI provider in the dictionary editor before using AI translation.

          This is a self-contained single-file Windows x64 build. A separately installed .NET runtime is not required.
          The EXE is kept in the package root. Configuration files are stored in the Config folder.
          The built-in headless Emuera analyzer library (from passed1999/era_mcp, based on EvilMask/emuera.em) is stored in tools/analyzer and shares the embedded .NET 10 runtime.
          Keep the Config, Docs, and tools folders beside the EXE. Do not run the EXE from inside the downloaded ZIP preview.
          '@ | Set-Content -LiteralPath (Join-Path $docsDirectory "Getting-Started.txt") -Encoding utf8

          Copy-Item -LiteralPath "README.md" -Destination (Join-Path $docsDirectory "README.md")
          if (Test-Path -LiteralPath ".tmp-era-mcp/README.md" -PathType Leaf) {
            Copy-Item -LiteralPath ".tmp-era-mcp/README.md" -Destination (Join-Path $docsDirectory "ThirdParty-era_mcp-README.md")
          }

          $rootDirectories = @(Get-ChildItem -LiteralPath $publishDirectory -Directory | Select-Object -ExpandProperty Name | Sort-Object)
          $expectedDirectories = @("Config", "Docs", "tools")
          if (Compare-Object -ReferenceObject $expectedDirectories -DifferenceObject $rootDirectories) {
            throw "Unexpected folders in release root: $($rootDirectories -join ', ')"
          }

      - name: Upload Windows x64 application
        uses: actions/upload-artifact@v4
        with:
          name: EraTrans-win-x64
          path: publish/win-x64/
          if-no-files-found: error
          retention-days: 30
